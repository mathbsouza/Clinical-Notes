<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080">
  <defs>
    <style>
      .panel{fill:#fff;stroke:#d4d4d4;stroke-width:2}.head{fill:#fff8ef;stroke:#c25b00;stroke-width:2.5}.card{fill:#fff;stroke:#222;stroke-width:1.8}.accent{fill:#fff4f4;stroke:#a51d2d;stroke-width:2}.title{font:700 28px Arial;fill:#111}.h{font:700 20px Arial;fill:#111}.result{font:700 18px Arial;fill:#7c2d12}.text{font:16px Arial;fill:#222}.small{font:14px Arial;fill:#444}.tag{fill:#c25b00}.tagtext{font:700 13px Arial;fill:#fff}.divider{stroke:#d4d4d4;stroke-width:1.5}.foot{fill:#fafafa;stroke:#777;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1500" height="1080" fill="#fff"/>
  <text class="title" x="750" y="42" text-anchor="middle">INTERPRETAÇÃO LABORATORIAL DA HIPONATREMIA</text>

  <rect class="panel" x="30" y="72" width="460" height="875" rx="14"/>
  <rect class="head" x="30" y="72" width="460" height="88" rx="14"/>
  <text class="h" x="260" y="108" text-anchor="middle">OSMOLARIDADE SÉRICA</text>
  <text class="small" x="260" y="136" text-anchor="middle">Define a tonicidade</text>
  <rect class="card" x="55" y="185" width="410" height="190" rx="12"/>
  <circle class="tag" cx="85" cy="215" r="16"/><text class="tagtext" x="85" y="220" text-anchor="middle">1</text>
  <text class="result" x="260" y="220" text-anchor="middle">&gt; 295 mOsm/kg</text>
  <line class="divider" x1="80" y1="245" x2="440" y2="245"/>
  <text class="text" x="260" y="280" text-anchor="middle">Hiponatremia hipertônica</text>
  <text class="small" x="260" y="315" text-anchor="middle">Hiperglicemia ou outro osmólito efetivo</text>
  <text class="small" x="260" y="342" text-anchor="middle">Tratar o osmólito; calcular Na corrigido</text>
  <rect class="card" x="55" y="395" width="410" height="210" rx="12"/>
  <circle class="tag" cx="85" cy="425" r="16"/><text class="tagtext" x="85" y="430" text-anchor="middle">2</text>
  <text class="result" x="260" y="430" text-anchor="middle">275–295 mOsm/kg</text>
  <line class="divider" x1="80" y1="455" x2="440" y2="455"/>
  <text class="text" x="260" y="490" text-anchor="middle">Pseudohiponatremia</text>
  <text class="small" x="260" y="525" text-anchor="middle">Hipertrigliceridemia / hiperproteinemia</text>
  <text class="small" x="260" y="552" text-anchor="middle">Suspeitar com método indireto</text>
  <text class="small" x="260" y="579" text-anchor="middle">Confirmar por ISE direto / gasometria</text>
  <rect class="accent" x="55" y="625" width="410" height="250" rx="12"/>
  <circle class="tag" cx="85" cy="655" r="16"/><text class="tagtext" x="85" y="660" text-anchor="middle">3</text>
  <text class="result" x="260" y="660" text-anchor="middle">&lt; 275 mOsm/kg</text>
  <line class="divider" x1="80" y1="685" x2="440" y2="685"/>
  <text class="text" x="260" y="725" text-anchor="middle">Hiponatremia hipotônica verdadeira</text>
  <text class="small" x="260" y="765" text-anchor="middle">Prosseguir com osmolaridade urinária</text>
  <text class="small" x="260" y="805" text-anchor="middle">A urgência depende de sintomas,</text>
  <text class="small" x="260" y="832" text-anchor="middle">duração e velocidade da queda do Na</text>

  <rect class="panel" x="520" y="72" width="460" height="875" rx="14"/>
  <rect class="head" x="520" y="72" width="460" height="88" rx="14"/>
  <text class="h" x="750" y="108" text-anchor="middle">OSMOLARIDADE URINÁRIA</text>
  <text class="small" x="750" y="136" text-anchor="middle">Mostra se a água livre está sendo excretada</text>
  <rect class="card" x="545" y="185" width="410" height="285" rx="12"/>
  <circle class="tag" cx="575" cy="215" r="16"/><text class="tagtext" x="575" y="220" text-anchor="middle">1</text>
  <text class="result" x="750" y="220" text-anchor="middle">≤ 100 mOsm/kg</text>
  <line class="divider" x1="570" y1="245" x2="930" y2="245"/>
  <text class="text" x="750" y="285" text-anchor="middle">ADH suprimido</text>
  <text class="small" x="750" y="325" text-anchor="middle">Excesso de água: polidipsia primária</text>
  <text class="small" x="750" y="355" text-anchor="middle">ou administração hipotônica</text>
  <text class="small" x="750" y="395" text-anchor="middle">Baixa oferta de solutos: potomania</text>
  <text class="small" x="750" y="425" text-anchor="middle">ou dieta pobre em proteína e sal</text>
  <rect class="accent" x="545" y="495" width="410" height="285" rx="12"/>
  <circle class="tag" cx="575" cy="525" r="16"/><text class="tagtext" x="575" y="530" text-anchor="middle">2</text>
  <text class="result" x="750" y="530" text-anchor="middle">&gt; 100 mOsm/kg</text>
  <line class="divider" x1="570" y1="555" x2="930" y2="555"/>
  <text class="text" x="750" y="595" text-anchor="middle">ADH ativo</text>
  <text class="small" x="750" y="635" text-anchor="middle">Resposta apropriada à hipoperfusão</text>
  <text class="small" x="750" y="665" text-anchor="middle">ou secreção inapropriada</text>
  <text class="small" x="750" y="715" text-anchor="middle">Próximo exame: sódio urinário</text>
  <text class="small" x="750" y="745" text-anchor="middle">na mesma amostra de urina</text>

  <rect class="panel" x="1010" y="72" width="460" height="875" rx="14"/>
  <rect class="head" x="1010" y="72" width="460" height="88" rx="14"/>
  <text class="h" x="1240" y="108" text-anchor="middle">SÓDIO URINÁRIO</text>
  <text class="small" x="1240" y="136" text-anchor="middle">Interpreta o volume arterial efetivo e perdas renais</text>
  <rect class="card" x="1035" y="185" width="410" height="285" rx="12"/>
  <circle class="tag" cx="1065" cy="215" r="16"/><text class="tagtext" x="1065" y="220" text-anchor="middle">1</text>
  <text class="result" x="1240" y="220" text-anchor="middle">≤ 30 mmol/L</text>
  <line class="divider" x1="1060" y1="245" x2="1420" y2="245"/>
  <text class="text" x="1240" y="285" text-anchor="middle">Baixo volume arterial efetivo</text>
  <text class="small" x="1240" y="325" text-anchor="middle">Hipertonodepletiva: perdas extrarrenais</text>
  <text class="small" x="1240" y="365" text-anchor="middle">Aquacumulativa: insuficiência cardíaca</text>
  <text class="small" x="1240" y="395" text-anchor="middle">ou cirrose, com ADH não osmótico</text>
  <text class="small" x="1240" y="435" text-anchor="middle">Avaliar edema e perfusão</text>
  <rect class="accent" x="1035" y="495" width="410" height="380" rx="12"/>
  <circle class="tag" cx="1065" cy="525" r="16"/><text class="tagtext" x="1065" y="530" text-anchor="middle">2</text>
  <text class="result" x="1240" y="530" text-anchor="middle">&gt; 30 mmol/L</text>
  <line class="divider" x1="1060" y1="555" x2="1420" y2="555"/>
  <text class="text" x="1240" y="595" text-anchor="middle">Considerar</text>
  <text class="small" x="1240" y="630" text-anchor="middle">SIAD • diurético • perda renal de sal</text>
  <text class="small" x="1240" y="660" text-anchor="middle">Insuficiência adrenal • hipotireoidismo</text>
  <text class="small" x="1240" y="705" text-anchor="middle">SIAD exige ausência de depleção/edema</text>
  <text class="small" x="1240" y="735" text-anchor="middle">e exclusão adrenal, tireoidiana e renal</text>
  <text class="small" x="1240" y="775" text-anchor="middle">Diurético, DRC e coleta após volume</text>
  <text class="small" x="1240" y="805" text-anchor="middle">reduzem a confiabilidade do NaU</text>

  <rect class="foot" x="180" y="975" width="1140" height="72" rx="12"/>
  <text class="text" x="750" y="1005" text-anchor="middle">Colher osmolaridade e sódio urinários simultaneamente, antes de administrar volume quando possível.</text>
  <text class="small" x="750" y="1032" text-anchor="middle">Sintomas graves exigem tratamento imediato; a investigação não deve atrasar NaCl 3%.</text>
</svg>