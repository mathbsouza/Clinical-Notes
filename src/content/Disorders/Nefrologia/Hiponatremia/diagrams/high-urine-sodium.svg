<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <style>
      .node{fill:#fff;stroke:#111;stroke-width:2}.key{fill:#fff8ef;stroke:#c25b00;stroke-width:2.5}.warn{fill:#fff4f4;stroke:#a51d2d;stroke-width:2}.line{fill:none;stroke:#111;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#111;stroke-width:2}.title{font:700 24px Arial;fill:#111}.head{font:700 18px Arial;fill:#111}.text{font:16px Arial;fill:#222}.small{font:14px Arial;fill:#333}.label{font:700 13px Arial;fill:#7c2d12}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <text class="title" x="600" y="36" text-anchor="middle">SÓDIO URINÁRIO &gt; 30 mmol/L</text>
  <rect class="key" x="360" y="62" width="480" height="86" rx="12"/>
  <text class="head" x="600" y="96" text-anchor="middle">OsmU &gt; 100 mOsm/kg + NaU &gt; 30 mmol/L</text>
  <text class="small" x="600" y="124" text-anchor="middle">Não concluir SIAD diretamente</text>
  <path class="guide" d="M600 148V190H200V220 M600 190H600V220 M600 190H1000V220"/>
  <rect class="warn" x="35" y="220" width="330" height="190" rx="12"/>
  <text class="head" x="200" y="254" text-anchor="middle">A confiabilidade do NaU caiu?</text>
  <text class="text" x="200" y="292" text-anchor="middle">Diurético recente</text>
  <text class="text" x="200" y="322" text-anchor="middle">Doença renal</text>
  <text class="text" x="200" y="352" text-anchor="middle">Coleta após expansão volêmica</text>
  <text class="small" x="200" y="388" text-anchor="middle">NaU perde especificidade: use contexto</text>
  <rect class="node" x="435" y="220" width="330" height="190" rx="12"/>
  <text class="head" x="600" y="254" text-anchor="middle">Excluir causas demonstráveis</text>
  <text class="text" x="600" y="292" text-anchor="middle">Diurético / perda renal de sal</text>
  <text class="text" x="600" y="322" text-anchor="middle">Insuficiência adrenal</text>
  <text class="text" x="600" y="352" text-anchor="middle">Hipotireoidismo</text>
  <text class="small" x="600" y="388" text-anchor="middle">Cortisol 8 h; TSH + T4 livre; função renal</text>
  <rect class="key" x="835" y="220" width="330" height="190" rx="12"/>
  <text class="head" x="1000" y="254" text-anchor="middle">Fenótipo compatível com SIAD?</text>
  <text class="text" x="1000" y="292" text-anchor="middle">Sem sinais de depleção</text>
  <text class="text" x="1000" y="322" text-anchor="middle">Sem edema clínico</text>
  <text class="text" x="1000" y="352" text-anchor="middle">Ingestão habitual de água e solutos</text>
  <text class="small" x="1000" y="388" text-anchor="middle">SIAD é diagnóstico de exclusão</text>
  <path class="line" d="M1000 410V470"/>
  <rect class="node" x="755" y="470" width="410" height="225" rx="12"/>
  <text class="head" x="960" y="505" text-anchor="middle">Critérios necessários para SIAD</text>
  <text class="text" x="785" y="545">✓ Osmolaridade sérica &lt; 275 mOsm/kg</text>
  <text class="text" x="785" y="578">✓ OsmU &gt; 100 mOsm/kg</text>
  <text class="text" x="785" y="611">✓ NaU &gt; 30 mmol/L com ingestão habitual</text>
  <text class="text" x="785" y="644">✓ Funções adrenal, tireoidiana e renal adequadas</text>
  <text class="text" x="785" y="677">✓ Sem uso recente de diurético</text>
  <path class="guide" d="M200 410V750H600 M600 410V750 M960 695V750H600"/>
  <path class="line" d="M600 750V790"/>
  <rect class="key" x="330" y="790" width="540" height="78" rx="12"/>
  <text class="head" x="600" y="823" text-anchor="middle">Integrar mecanismo, exames e contexto clínico</text>
  <text class="small" x="600" y="849" text-anchor="middle">Tratar a causa confirmada; reservar SIAD para exclusão adequada</text>
</svg>