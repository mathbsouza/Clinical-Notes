<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<defs><style>.card{fill:#fff;stroke:#111;stroke-width:2}.head1{fill:#fff3ed;stroke:#c2410c;stroke-width:2.5}.head2{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.head3{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.section{fill:#fafafa;stroke:#bbb;stroke-width:1.5}.T{font:700 27px Arial;fill:#111}.H{font:700 19px Arial;fill:#111}.t{font:16px Arial;fill:#222}.s{font:14px Arial;fill:#444}.tag{font:700 13px Arial;fill:#7c2d12;letter-spacing:.06em}</style></defs><rect width="1500" height="1120" fill="#fff"/>
<text class="T" x="750" y="48" text-anchor="middle">PRINCIPAIS CAUSAS POR MECANISMO</text>

<rect class="card" x="30" y="80" width="460" height="990" rx="14"/><rect class="head1" x="30" y="80" width="460" height="105" rx="14"/><text class="H" x="260" y="120" text-anchor="middle">HIPERTONODEPLETIVA</text><text class="s" x="260" y="150" text-anchor="middle">Perda de soluto proporcionalmente maior</text><text class="s" x="260" y="172" text-anchor="middle">que a perda de água</text>
<rect class="section" x="55" y="215" width="410" height="185" rx="10"/><text class="tag" x="80" y="247">PERDAS EXTRARRENAIS</text><text class="t" x="80" y="282">• Vômitos, diarreia, fístulas e drenagens</text><text class="t" x="80" y="315">• Sudorese intensa e queimaduras</text><text class="t" x="80" y="348">• Pancreatite, peritonite e terceiro espaço</text><text class="s" x="80" y="382">Pista: Na urinário geralmente ≤30 mmol/L</text>
<rect class="section" x="55" y="425" width="410" height="245" rx="10"/><text class="tag" x="80" y="457">PERDAS RENAIS</text><text class="t" x="80" y="492">• Tiazídicos; menos frequentemente alça</text><text class="t" x="80" y="525">• Nefropatia perdedora de sal</text><text class="t" x="80" y="558">• Diurese osmótica / bicarbonatúria</text><text class="t" x="80" y="591">• Perda cerebral de sal (rara)</text><text class="t" x="80" y="624">• Deficiência mineralocorticoide</text><text class="s" x="80" y="654">Pista: Na urinário frequentemente &gt;30 mmol/L</text>
<rect class="section" x="55" y="695" width="410" height="220" rx="10"/><text class="tag" x="80" y="727">INSUFICIÊNCIA ADRENAL PRIMÁRIA</text><text class="t" x="80" y="762">Perda renal de Na + estímulo de ADH</text><text class="t" x="80" y="795">Hipotensão, hipercalemia, hipoglicemia</text><text class="t" x="80" y="828">e hiperpigmentação podem coexistir</text><text class="s" x="80" y="870">Dosar cortisol; não atrasar corticoide</text><text class="s" x="80" y="893">se houver crise adrenal</text>
<text class="s" x="260" y="1025" text-anchor="middle">Mecanismo predominante: depleção de soluto</text>

<rect class="card" x="520" y="80" width="460" height="990" rx="14"/><rect class="head2" x="520" y="80" width="460" height="105" rx="14"/><text class="H" x="750" y="120" text-anchor="middle">AQUACUMULATIVA</text><text class="s" x="750" y="150" text-anchor="middle">Retenção renal de água por ADH</text><text class="s" x="750" y="172" text-anchor="middle">osmótica ou não osmótica</text>
<rect class="section" x="545" y="215" width="410" height="330" rx="10"/><text class="tag" x="570" y="247">SIAD</text><text class="t" x="570" y="282">• Fármacos: ISRS, carbamazepina,</text><text class="t" x="590" y="309">oxcarbazepina, antipsicóticos, opioides</text><text class="t" x="570" y="344">• SNC: AVC, hemorragia, infecção, trauma</text><text class="t" x="570" y="377">• Pulmão: pneumonia, TB, ventilação</text><text class="t" x="570" y="410">• Neoplasia: carcinoma pulmonar pequenas células</text><text class="t" x="570" y="443">• Dor, náusea e pós-operatório</text><text class="s" x="570" y="482">Diagnóstico de exclusão: adrenal, tireoide,</text><text class="s" x="570" y="507">rim e diuréticos precisam ser avaliados</text>
<rect class="section" x="545" y="570" width="410" height="225" rx="10"/><text class="tag" x="570" y="602">BAIXO VOLUME ARTERIAL EFETIVO</text><text class="t" x="570" y="637">• Insuficiência cardíaca</text><text class="t" x="570" y="670">• Cirrose com hipertensão portal</text><text class="t" x="570" y="703">• Síndrome nefrótica / hipoalbuminemia</text><text class="t" x="570" y="736">• Doença renal avançada</text><text class="s" x="570" y="773">Edema não significa volume arterial adequado</text>
<rect class="section" x="545" y="820" width="410" height="145" rx="10"/><text class="tag" x="570" y="852">ENDOCRINOPATIAS</text><text class="t" x="570" y="887">• Insuficiência adrenal secundária</text><text class="t" x="570" y="920">• Hipotireoidismo grave (incomum)</text><text class="s" x="570" y="950">Predomina redução da excreção de água livre</text>
<text class="s" x="750" y="1025" text-anchor="middle">Pista: osmolaridade urinária &gt;100 mOsm/kg</text>

<rect class="card" x="1010" y="80" width="460" height="990" rx="14"/><rect class="head3" x="1010" y="80" width="460" height="105" rx="14"/><text class="H" x="1240" y="120" text-anchor="middle">HIPOTONOCUMULATIVA</text><text class="s" x="1240" y="150" text-anchor="middle">Entrada de líquido hipotônico superior</text><text class="s" x="1240" y="172" text-anchor="middle">à capacidade renal de eliminação</text>
<rect class="section" x="1035" y="215" width="410" height="210" rx="10"/><text class="tag" x="1060" y="247">EXCESSO DE ÁGUA</text><text class="t" x="1060" y="282">• Polidipsia primária / psicogênica</text><text class="t" x="1060" y="315">• Ingestão compulsiva ou desafio hídrico</text><text class="t" x="1060" y="348">• Soluções IV hipotônicas</text><text class="t" x="1060" y="381">• Água durante exercício prolongado</text>
<rect class="section" x="1035" y="450" width="410" height="230" rx="10"/><text class="tag" x="1060" y="482">BAIXA OFERTA DE SOLUTOS</text><text class="t" x="1060" y="517">• Potomania por cerveja</text><text class="t" x="1060" y="550">• Dieta “chá e torradas”</text><text class="t" x="1060" y="583">• Dieta muito pobre em proteína e sal</text><text class="t" x="1060" y="616">• Desnutrição com alta ingestão de líquidos</text><text class="s" x="1060" y="654">Poucos osmóis limitam o volume urinário máximo</text>
<rect class="section" x="1035" y="705" width="410" height="210" rx="10"/><text class="tag" x="1060" y="737">QUANDO A EXCREÇÃO JÁ ESTÁ LIMITADA</text><text class="t" x="1060" y="772">Pequeno excesso adicional de água pode causar</text><text class="t" x="1060" y="802">queda importante do Na se houver baixa TFG,</text><text class="t" x="1060" y="832">náusea, dor ou outro estímulo transitório de ADH</text><text class="s" x="1060" y="878">Pode haver mecanismo misto</text>
<text class="s" x="1240" y="1002" text-anchor="middle">Pista: osmolaridade urinária ≤100 mOsm/kg</text><text class="s" x="1240" y="1027" text-anchor="middle">quando o ADH está completamente suprimido</text>
</svg>