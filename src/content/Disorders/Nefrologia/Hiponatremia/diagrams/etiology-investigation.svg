<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1940" viewBox="0 0 1500 1940">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker><style>.b{fill:#fff;stroke:#111;stroke-width:2}.d{fill:#fff8ef;stroke:#c25b00;stroke-width:2.5}.e{fill:#fff3f3;stroke:#a51d2d;stroke-width:2}.t{font:16px Arial;fill:#222}.s{font:14px Arial;fill:#333}.h{font:700 19px Arial;fill:#111}.T{font:700 26px Arial;fill:#111}.l{fill:none;stroke:#111;stroke-width:2;marker-end:url(#a)}.y{font:700 14px Arial;fill:#7c2d12}</style></defs><rect width="1500" height="1940" fill="#fff"/>
<rect class="b" x="500" y="30" width="500" height="85" rx="12"/><text class="T" x="750" y="66" text-anchor="middle">INVESTIGAÇÃO ETIOLÓGICA</text><text class="t" x="750" y="96" text-anchor="middle">Na &lt;135 mmol/L confirmado</text>
<path class="l" d="M750 115V160"/><rect class="d" x="535" y="160" width="430" height="90" rx="12"/><text class="h" x="750" y="195" text-anchor="middle">Osmolaridade sérica</text><text class="s" x="750" y="224" text-anchor="middle">Colher glicose; urina antes de volume, se possível</text>
<path class="l" d="M535 205H235V300"/><text class="y" x="385" y="194" text-anchor="middle">&gt;295</text><path class="l" d="M750 250V300"/><text class="y" x="770" y="278">275–295</text><path class="l" d="M965 205H1265V300"/><text class="y" x="1115" y="194" text-anchor="middle">&lt;275</text>
<rect class="b" x="35" y="300" width="400" height="170" rx="12"/><text class="h" x="235" y="335" text-anchor="middle">Hipertônica / translocacional</text><text class="t" x="235" y="372" text-anchor="middle">Hiperglicemia → calcular Na corrigido</text><text class="t" x="235" y="402" text-anchor="middle">Mannitol, contraste, glicina, maltose</text><text class="s" x="235" y="440" text-anchor="middle">Tratar o osmólito; não presumir déficit de Na</text>
<rect class="b" x="550" y="300" width="400" height="170" rx="12"/><text class="h" x="750" y="335" text-anchor="middle">Isotônica / pseudohiponatremia</text><text class="t" x="750" y="372" text-anchor="middle">Triglicerídeos e proteínas totais</text><text class="t" x="750" y="402" text-anchor="middle">Suspeitar se laboratório usa ISE indireto</text><text class="s" x="750" y="440" text-anchor="middle">Confirmar com ISE direto / gasometria</text>
<rect class="d" x="1065" y="300" width="400" height="130" rx="12"/><text class="h" x="1265" y="340" text-anchor="middle">Hipotônica verdadeira</text><text class="t" x="1265" y="377" text-anchor="middle">Osmolaridade urinária</text><text class="s" x="1265" y="405" text-anchor="middle">Mesmo momento da amostra sanguínea</text>
<path class="l" d="M1265 430V500H1010V555"/><text class="y" x="1110" y="490">≤100</text><path class="l" d="M1265 430V765"/><text class="y" x="1280" y="490">&gt;100</text>
<rect class="b" x="810" y="555" width="400" height="185" rx="12"/><text class="h" x="1010" y="590" text-anchor="middle">ADH suprimido</text><text class="t" x="1010" y="625" text-anchor="middle">Polidipsia primária / água iatrogênica</text><text class="t" x="1010" y="655" text-anchor="middle">Potomania / dieta pobre em proteína e sal</text><text class="s" x="1010" y="695" text-anchor="middle">Distinguir pela história de ingestão</text><text class="s" x="1010" y="719" text-anchor="middle">e pela baixa excreção diária de osmóis</text>
<rect class="d" x="1065" y="555" width="400" height="120" rx="12" transform="translate(0 210)"/><text class="h" x="1265" y="805" text-anchor="middle">ADH ativo: Na urinário</text><text class="s" x="1265" y="838" text-anchor="middle">Interpretar diuréticos e doença renal</text>
<path class="l" d="M1265 885V940H820V995"/><text class="y" x="1035" y="930">≤30 mmol/L</text><path class="l" d="M1265 885V995"/><text class="y" x="1280" y="930">&gt;30 mmol/L</text>
<rect class="d" x="600" y="995" width="440" height="100" rx="12"/><text class="h" x="820" y="1032" text-anchor="middle">Baixo volume arterial efetivo</text><text class="t" x="820" y="1065" text-anchor="middle">Há edema clínico?</text>
<path class="l" d="M600 1045H360V1145"/><text class="y" x="480" y="1034">NÃO</text><path class="l" d="M820 1095V1145"/><text class="y" x="840" y="1125">SIM</text>
<rect class="b" x="120" y="1145" width="480" height="190" rx="12"/><text class="h" x="360" y="1180" text-anchor="middle">Depleção verdadeira</text><text class="t" x="360" y="1215" text-anchor="middle">Vômitos/diarreia, hemorragia, terceiro espaço</text><text class="t" x="360" y="1245" text-anchor="middle">NaU pode ser &gt;30: diurético, perda renal de sal</text><text class="s" x="360" y="1284" text-anchor="middle">Vômitos: Cl urinário pode ser mais informativo</text><text class="s" x="360" y="1308" text-anchor="middle">Considerar insuficiência adrenal primária</text>
<rect class="b" x="620" y="1145" width="400" height="190" rx="12"/><text class="h" x="820" y="1180" text-anchor="middle">Estado edematoso</text><text class="t" x="820" y="1215" text-anchor="middle">Insuficiência cardíaca</text><text class="t" x="820" y="1245" text-anchor="middle">Cirrose / síndrome nefrótica</text><text class="t" x="820" y="1275" text-anchor="middle">Doença renal avançada</text><text class="s" x="820" y="1310" text-anchor="middle">ADH não osmótico por subperfusão arterial</text>
<rect class="d" x="1065" y="995" width="400" height="100" rx="12"/><text class="h" x="1265" y="1032" text-anchor="middle">Diurético ou DRC?</text><text class="s" x="1265" y="1065" text-anchor="middle">NaU perde especificidade</text>
<path class="l" d="M1265 1095V1145"/>
<rect class="b" x="1065" y="1145" width="400" height="220" rx="12"/><text class="h" x="1265" y="1180" text-anchor="middle">Revisar interferentes</text><text class="t" x="1265" y="1215" text-anchor="middle">Tiazídicos e diuréticos recentes/ocultos</text><text class="t" x="1265" y="1245" text-anchor="middle">Função renal e ingestão de sal</text><text class="t" x="1265" y="1275" text-anchor="middle">Cortisol 8 h ± teste com ACTH</text><text class="t" x="1265" y="1305" text-anchor="middle">TSH + T4 livre</text><text class="s" x="1265" y="1340" text-anchor="middle">FE urato pode ajudar se diurético confunde</text>
<path class="l" d="M1265 1365V1415"/><rect class="d" x="1035" y="1415" width="460" height="105" rx="12"/><text class="h" x="1265" y="1452" text-anchor="middle">Outra causa identificada?</text><text class="s" x="1265" y="1485" text-anchor="middle">Adrenal, tireoidiana, renal ou medicamentosa</text>
<path class="l" d="M1035 1468H850V1570"/><text class="y" x="945" y="1457">SIM</text><path class="l" d="M1265 1520V1570"/><text class="y" x="1282" y="1552">NÃO</text>
<rect class="b" x="620" y="1570" width="460" height="160" rx="12"/><text class="h" x="850" y="1608" text-anchor="middle">Tratar a causa demonstrada</text><text class="t" x="850" y="1645" text-anchor="middle">Insuficiência adrenal → corticoide</text><text class="t" x="850" y="1675" text-anchor="middle">Tiazídico → suspender</text><text class="s" x="850" y="1710" text-anchor="middle">Antecipar aquarese após reversão</text>
<rect class="e" x="1090" y="1570" width="350" height="280" rx="12"/><text class="h" x="1265" y="1608" text-anchor="middle">SIAD: diagnóstico de exclusão</text><text class="t" x="1265" y="1645" text-anchor="middle">Osm sérica &lt;275</text><text class="t" x="1265" y="1675" text-anchor="middle">OsmU &gt;100 + NaU &gt;30</text><text class="t" x="1265" y="1705" text-anchor="middle">Sem depleção ou edema</text><text class="t" x="1265" y="1735" text-anchor="middle">Funções adrenal, tireoidiana e renal adequadas</text><text class="t" x="1265" y="1765" text-anchor="middle">Sem diurético recente</text><text class="s" x="1265" y="1805" text-anchor="middle">Procurar dor/náusea, SNC, pulmão,</text><text class="s" x="1265" y="1829" text-anchor="middle">neoplasia e fármacos associados</text>
<path class="l" d="M500 75H20V1892H400"/><rect class="e" x="400" y="1865" width="700" height="55" rx="12"/><text class="s" x="750" y="1898" text-anchor="middle">Sintomas graves: tratar imediatamente; a investigação etiológica não deve atrasar NaCl 3%</text>
</svg>