<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma da hipertensão secundária</title>
  <desc id="desc">Hipertensão secundária como síndrome clínica, com critérios de suspeita e abordagem diagnóstica direcionada à confirmação da etiologia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123b66"/>
      <stop offset="100%" stop-color="#1f6aa5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f2b45" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b557d"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.2px; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: rgba(255,255,255,0.92); }
      .box-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #123b66; }
      .box-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #21364a; }
      .small { font: 400 16px Arial, Helvetica, sans-serif; fill: #21364a; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #43607c; text-transform: uppercase; letter-spacing: 1.2px; }
      .card { fill: #ffffff; stroke: #b9cbe0; stroke-width: 2.5; rx: 26; ry: 26; }
      .accent { fill: #eff6ff; stroke: #7aa7d6; stroke-width: 2.5; rx: 22; ry: 22; }
      .accent-green { fill: #f1fbf6; stroke: #7bbf9a; stroke-width: 2.5; rx: 22; ry: 22; }
      .accent-amber { fill: #fff8ed; stroke: #d7ab66; stroke-width: 2.5; rx: 22; ry: 22; }
      .arrow { stroke: #2b557d; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #5d7f9f; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="60" width="1440" height="130" rx="28" ry="28" fill="url(#header)"/>
    <text x="110" y="115" class="title">Hipertensão secundária</text>
    <text x="110" y="150" class="subtitle">Síndrome clínica por causa identificável e potencialmente tratável</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="240" width="660" height="150" class="card"/>
    <text x="800" y="286" text-anchor="middle" class="box-title">Definição sindrômica</text>
    <text x="800" y="325" text-anchor="middle" class="box-text">
      <tspan x="800" dy="0">Elevação sustentada da pressão arterial</tspan>
      <tspan x="800" dy="28">decorrente de uma causa subjacente identificável</tspan>
      <tspan x="800" dy="28">e com possibilidade de tratamento específico</tspan>
    </text>
  </g>

  <path d="M800 390 L800 470" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="120" y="470" width="560" height="320" class="accent-amber"/>
    <text x="400" y="522" text-anchor="middle" class="box-title">Quando suspeitar?</text>
    <text x="160" y="568" class="small">
      <tspan x="160" dy="0">• Início precoce, especialmente antes dos 30 anos</tspan>
      <tspan x="160" dy="28">• Início abrupto ou piora súbita de hipertensão prévia</tspan>
      <tspan x="160" dy="28">• Hipertensão resistente ou grave</tspan>
      <tspan x="160" dy="28">• Dificuldade de controle apesar de tratamento adequado</tspan>
      <tspan x="160" dy="28">• Lesão de órgão-alvo desproporcional à duração</tspan>
      <tspan x="160" dy="28">• Achados clínicos ou laboratoriais sugestivos de etiologia específica</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="470" width="560" height="320" class="accent"/>
    <text x="1200" y="522" text-anchor="middle" class="box-title">Como investigar?</text>
    <text x="960" y="568" class="small">
      <tspan x="960" dy="0">1. Direcionar a investigação pelo perfil clínico</tspan>
      <tspan x="960" dy="28">2. Selecionar testes de rastreio para as etiologias</tspan>
      <tspan x="960" dy="28">   mais prováveis em cada paciente</tspan>
      <tspan x="960" dy="28">3. Confirmar a etiologia específica quando o rastreio</tspan>
      <tspan x="960" dy="28">   for positivo e a confirmação for aplicável</tspan>
    </text>
  </g>

  <path d="M680 630 L710 630" class="arrow-soft"/>
  <path d="M920 630 L890 630" class="arrow-soft"/>

  <g filter="url(#shadow)">
    <rect x="320" y="860" width="960" height="160" class="accent-green"/>
    <text x="800" y="912" text-anchor="middle" class="box-title">Etiologias frequentes ou importantes de rastrear</text>
    <text x="360" y="958" class="small">
      <tspan x="360" dy="0">• Renovascular</tspan>
      <tspan x="520" dy="0">• Hiperaldosteronismo primário</tspan>
      <tspan x="790" dy="0">• Feocromocitoma/paraganglioma</tspan>
      <tspan x="1110" dy="0">• Endócrinas, renais, apneia do sono e fármacos</tspan>
    </text>
    <text x="800" y="1002" text-anchor="middle" class="small">A síndrome não é uma doença única: múltiplas condições podem gerar o mesmo fenótipo hipertensivo.</text>
  </g>

  <path d="M400 790 C400 825, 560 835, 660 850" class="arrow-soft"/>
  <path d="M1200 790 C1200 825, 1040 835, 940 850" class="arrow-soft"/>
</svg>
